name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voiceorder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # ANTHROPIC_API_KEY is deliberately not set here: the LLM golden-caller
      # suite (tests/golden/test_llm_golden_callers.py) skips itself without
      # it. That's on purpose (build plan section 7) -- a free/fast tier runs
      # on every commit, the paid LLM tier runs deliberately, not from CI.
      #
      # TEST_DATABASE_URL points at the postgres service above, so
      # tests/unit/test_postgres_backup.py runs for real instead of skipping.
      # RedisCartStore is covered separately via fakeredis, which needs no
      # service container.
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voiceorder_test
        run: pytest -q
