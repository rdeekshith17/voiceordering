services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voiceorder
      POSTGRES_PASSWORD: voiceorder
      POSTGRES_DB: voiceorder
    ports:
      - "5432:5432"
    volumes:
      - voiceorder-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  voiceorder-postgres:
